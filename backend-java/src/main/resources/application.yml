spring:
  application:
    name: portfolio-chatbot-backend
  
  # Server configuration
  server:
    port: ${PORT:8080}
    servlet:
      context-path: /
  
  # MongoDB configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/portfolio-chatbot}
      auto-index-creation: true
  
  # Google Gemini API Key
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY:}

server:
  port: ${PORT:8080}

# Logging configuration
logging:
  level:
    root: INFO
    com.portfolio: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application configuration
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - https://krushnatkhawale.github.io
  rate-limit:
    max-requests-per-24h: 5
  knowledge-base:
    path: classpath:knowledge.json